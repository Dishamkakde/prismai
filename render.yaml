services:
  - type: web
    name: prismai
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@prismai.edu
      - key: ADMIN_PASSWORD
        value: PrismAdmin@2025
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.0
