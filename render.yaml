services:
  - type: web
    name: prismai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///prismai.db
      - key: FLASK_ENV
        value: production
      - key: UPLOAD_FOLDER
        value: app/static/uploads
