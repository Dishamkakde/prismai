{% extends 'base.html' %}
{% block title %}Forgot Password — PRISM AI{% endblock %}
{% block content %}
<div class="auth-page centered">
    <div class="auth-card standalone">
        <div class="auth-card-header">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="PRISM AI" class="choice-logo">
            <h2>Reset Password</h2>
            <p>Enter your registered email to receive a reset link.</p>
        </div>
        <form class="auth-form" method="POST">
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" name="email" placeholder="your@college.edu" required>
            </div>
            <button type="submit" class="btn-auth">
                <i class="fas fa-paper-plane"></i> Send Reset Link
            </button>
            <a href="{{ url_for('auth.login_member') }}" class="btn-back">
                <i class="fas fa-arrow-left"></i> Back to Login
            </a>
        </form>
    </div>
</div>
{% endblock %}
