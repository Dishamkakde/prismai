{% extends 'base.html' %}
{% block title %}Set New Password — PRISM AI{% endblock %}
{% block content %}
<div class="auth-page centered">
    <div class="auth-card standalone">
        <div class="auth-card-header">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="PRISM AI" class="choice-logo">
            <h2>Set New Password</h2>
            <p>Choose a strong password for your account.</p>
        </div>
        <form class="auth-form" method="POST">
            <div class="form-group">
                <label><i class="fas fa-lock"></i> New Password</label>
                <div class="input-group">
                    <input type="password" name="password" id="pw1" placeholder="Min 8 characters" required>
                    <button type="button" class="input-toggle" onclick="togglePassword('pw1', this)"><i class="fas fa-eye"></i></button>
                </div>
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Confirm New Password</label>
                <div class="input-group">
                    <input type="password" name="confirm_password" id="pw2" placeholder="Repeat password" required>
                    <button type="button" class="input-toggle" onclick="togglePassword('pw2', this)"><i class="fas fa-eye"></i></button>
                </div>
            </div>
            <button type="submit" class="btn-auth">
                <i class="fas fa-check"></i> Reset Password
            </button>
        </form>
    </div>
</div>
{% endblock %}
