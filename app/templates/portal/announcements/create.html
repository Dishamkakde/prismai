{% extends 'portal_base.html' %}
{% block title %}New Announcement — PRISM AI{% endblock %}
{% block breadcrumb %}Announcements / Create{% endblock %}
{% block content %}
<div class="form-page">
    <div class="form-page-header"><h1><i class="fas fa-bullhorn"></i> New Announcement</h1></div>
    <form method="POST" class="portal-form">
        <div class="form-group">
            <label>Title *</label>
            <input type="text" name="title" placeholder="Announcement title" required>
        </div>
        <div class="form-group">
            <label>Content *</label>
            <textarea name="content" rows="8" placeholder="Write your announcement..." required></textarea>
        </div>
        <div class="form-row-2">
            <div class="form-group">
                <label>Category</label>
                <select name="category">
                    {% for cat in categories %}
                    <option value="{{ cat }}">{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Priority</label>
                <select name="priority">
                    <option value="Normal">Normal</option>
                    <option value="Important">Important</option>
                    <option value="Urgent">Urgent</option>
                </select>
            </div>
        </div>
        <div class="form-row-2">
            <div class="form-group">
                <label>Target Department (optional)</label>
                <input type="text" name="target_department" placeholder="Leave blank for all">
            </div>
            <div class="form-group">
                <label>Expires On (optional)</label>
                <input type="date" name="expires_at">
            </div>
        </div>
        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox" name="is_pinned"> Pin this announcement to the top
            </label>
        </div>
        <div class="form-actions">
            <a href="{{ url_for('announcements.list_announcements') }}" class="btn-cancel">Cancel</a>
            <button type="submit" class="btn-primary-sm"><i class="fas fa-paper-plane"></i> Publish</button>
        </div>
    </form>
</div>
{% endblock %}
