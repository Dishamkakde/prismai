{% extends 'portal_base.html' %}
{% block title %}Schedule Meeting — PRISM AI{% endblock %}
{% block breadcrumb %}Meetings / Schedule{% endblock %}
{% block content %}
<div class="form-page">
    <div class="form-page-header">
        <h1><i class="fas fa-calendar-plus"></i> Schedule Meeting</h1>
    </div>
    <form method="POST" class="portal-form">
        <div class="form-group">
            <label>Meeting Title *</label>
            <input type="text" name="title" placeholder="e.g. Sprint Review, Research Discussion" required>
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="2" placeholder="Brief description..."></textarea>
        </div>
        <div class="form-row-2">
            <div class="form-group">
                <label>Date *</label>
                <input type="date" name="meeting_date" required>
            </div>
            <div class="form-group">
                <label>Time *</label>
                <input type="time" name="meeting_time" required>
            </div>
        </div>
        <div class="form-row-2">
            <div class="form-group">
                <label>Duration (minutes)</label>
                <input type="number" name="duration_minutes" value="60" min="15" max="480">
            </div>
            <div class="form-group">
                <label>Meeting Type</label>
                <select name="meeting_type">
                    <option value="team">Team Meeting</option>
                    <option value="project">Project Meeting</option>
                    <option value="general">General</option>
                    <option value="one-on-one">One-on-One</option>
                </select>
            </div>
        </div>
        <div class="form-row-2">
            <div class="form-group">
                <label>Venue</label>
                <input type="text" name="venue" placeholder="Room 101, Lab, etc.">
            </div>
            <div class="form-group">
                <label>Online Meeting Link</label>
                <input type="url" name="meeting_link" placeholder="https://meet.google.com/...">
            </div>
        </div>
        <div class="form-group">
            <label>Link to Project</label>
            <select name="project_id">
                <option value="">None</option>
                {% for p in projects %}
                <option value="{{ p.id }}">{{ p.title }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Agenda</label>
            <textarea name="agenda" rows="4" placeholder="1. Review last week\n2. Current blockers\n3. Next steps..."></textarea>
        </div>
        <div class="form-group">
            <label>Participants *</label>
            <div class="multi-select-list">
                {% for m in members %}
                <label class="check-item">
                    <input type="checkbox" name="participant_ids" value="{{ m.id }}">
                    <span>{{ m.profile.full_name if m.profile else m.email }}</span>
                    <small>{{ m.role.replace('_',' ').title() }}</small>
                </label>
                {% endfor %}
            </div>
        </div>
        <div class="form-actions">
            <a href="{{ url_for('meetings.my_meetings') }}" class="btn-cancel">Cancel</a>
            <button type="submit" class="btn-primary-sm"><i class="fas fa-check"></i> Schedule Meeting</button>
        </div>
    </form>
</div>
{% endblock %}
