{% extends 'portal_base.html' %}
{% block title %}Add Research Paper — PRISM AI{% endblock %}
{% block breadcrumb %}Research Hub / Add{% endblock %}
{% block content %}
<div class="form-page">
    <div class="form-page-header">
        <h1><i class="fas fa-plus-circle"></i> Add Research Paper</h1>
    </div>
    <form method="POST" enctype="multipart/form-data" class="portal-form">
        <div class="form-section">
            <h3>Paper Information</h3>
            <div class="form-group">
                <label>Paper Title *</label>
                <input type="text" name="title" placeholder="Full paper title" required>
            </div>
            <div class="form-row-2">
                <div class="form-group">
                    <label>Authors</label>
                    <input type="text" name="authors" placeholder="Author 1, Author 2, ...">
                </div>
                <div class="form-group">
                    <label>Source / Journal</label>
                    <input type="text" name="source" placeholder="arXiv, IEEE, ACM, etc.">
                </div>
            </div>
            <div class="form-row-2">
                <div class="form-group">
                    <label>Publication Date</label>
                    <input type="date" name="publication_date">
                </div>
                <div class="form-group">
                    <label>Research Topic</label>
                    <input type="text" name="research_topic" placeholder="Computer Vision, NLP, etc.">
                </div>
            </div>
            <div class="form-group">
                <label>Publication Link</label>
                <input type="url" name="publication_link" placeholder="https://arxiv.org/abs/...">
            </div>
        </div>
        <div class="form-section">
            <h3>Research Details</h3>
            <div class="form-group">
                <label>Methodology</label>
                <textarea name="methodology" rows="3" placeholder="Methods used in this paper..."></textarea>
            </div>
            <div class="form-group">
                <label>Key Findings</label>
                <textarea name="key_findings" rows="4" placeholder="Main results and contributions..."></textarea>
            </div>
            <div class="form-group">
                <label>Research Gaps</label>
                <textarea name="research_gaps" rows="3" placeholder="Limitations and future work opportunities..."></textarea>
            </div>
            <div class="form-group">
                <label>References</label>
                <textarea name="references" rows="3" placeholder="Key references cited..."></textarea>
            </div>
            <div class="form-group">
                <label>Personal Notes</label>
                <textarea name="notes" rows="3" placeholder="Your own notes and observations..."></textarea>
            </div>
        </div>
        <div class="form-section">
            <h3>Assignment</h3>
            <div class="form-row-2">
                <div class="form-group">
                    <label>Link to Project</label>
                    <select name="project_id">
                        <option value="">None</option>
                        {% for p in projects %}
                        <option value="{{ p.id }}">{{ p.title }}</option>
                        {% endfor %}
                    </select>
                </div>
                {% if members %}
                <div class="form-group">
                    <label>Assigned Researcher</label>
                    <select name="assigned_researcher">
                        <option value="">None</option>
                        {% for m in members %}
                        <option value="{{ m.id }}">{{ m.profile.full_name if m.profile else m.email }}</option>
                        {% endfor %}
                    </select>
                </div>
                {% endif %}
            </div>
            <div class="form-group">
                <label>Upload PDF</label>
                <input type="file" name="paper_file" accept=".pdf,.doc,.docx">
            </div>
        </div>
        <div class="form-actions">
            <a href="{{ url_for('research.hub') }}" class="btn-cancel">Cancel</a>
            <button type="submit" class="btn-primary-sm"><i class="fas fa-check"></i> Add Paper</button>
        </div>
    </form>
</div>
{% endblock %}
