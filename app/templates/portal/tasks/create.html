{% extends 'portal_base.html' %}
{% block title %}Create Task — PRISM AI{% endblock %}
{% block breadcrumb %}Tasks / Create{% endblock %}
{% block content %}
<div class="form-page">
    <div class="form-page-header">
        <h1><i class="fas fa-plus-circle"></i> Create Task</h1>
    </div>
    <form method="POST" class="portal-form" id="taskForm">
        <div class="form-group">
            <label>Project *</label>
            <select name="project_id" id="projectSelect" onchange="loadMembers()" required>
                <option value="">Select project</option>
                {% for p in projects %}
                <option value="{{ p.id }}" data-members="{{ p.members|map(attribute='id')|list|tojson }}">
                    {{ p.title }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Task Title *</label>
            <input type="text" name="title" placeholder="What needs to be done?" required>
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="4" placeholder="Detailed description, requirements, expectations..."></textarea>
        </div>
        <div class="form-row-2">
            <div class="form-group">
                <label>Assign To</label>
                <select name="assignee_id" id="assigneeSelect">
                    <option value="">Select member</option>
                    {% for p in projects %}
                    {% for m in p.members %}
                    <option value="{{ m.id }}" data-project="{{ p.id }}">
                        {{ m.profile.full_name if m.profile else m.email }}
                    </option>
                    {% endfor %}
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Priority</label>
                <select name="priority">
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>
                    <option value="Urgent">Urgent</option>
                </select>
            </div>
        </div>
        <div class="form-row-2">
            <div class="form-group">
                <label>Due Date</label>
                <input type="date" name="due_date">
            </div>
            <div class="form-group">
                <label>Reference Materials</label>
                <input type="text" name="reference_materials" placeholder="Links, docs, resources...">
            </div>
        </div>
        <div class="form-actions">
            <a href="{{ url_for('tasks.my_tasks') }}" class="btn-cancel">Cancel</a>
            <button type="submit" class="btn-primary-sm"><i class="fas fa-check"></i> Create Task</button>
        </div>
    </form>
</div>
{% endblock %}
{% block extra_js %}
<script>
function loadMembers() {
    const projectId = document.getElementById('projectSelect').value;
    const assigneeSelect = document.getElementById('assigneeSelect');
    const options = assigneeSelect.querySelectorAll('option[data-project]');
    options.forEach(opt => {
        opt.style.display = (!projectId || opt.dataset.project === projectId) ? '' : 'none';
    });
    assigneeSelect.value = '';
}
</script>
{% endblock %}
